# Every governing rule, and what enforces it in this repository.
#
# Checked by tests/test_traceability.py, whose docstring states what it does and
# does not prove. One row per rule in ../l3io-wordpress-backup -- every AD-n in
# ARCHITECTURE-SPINE.md and every docs/adr/NNNN-*.md -- including those that do
# not bind this package, so that judgement is on a reviewed row.
#
#   binds = true   needs at least one of:
#     enforced_by    tests/x.py::name | tests/x.py::Class::name
#                    .github/workflows/x.yml::job-id::step name | a repo path
#     untested       checkable, but nothing checks it yet -- a gap, stated
#     not_checkable  prose only, and why
#   binds = false  needs a reason, and none of the three above
#   note           optional, either way
#
# source_sha256 is the hash of the rule's text when this row was last judged.
# When the governing text changes, the local test fails and prints the new hash:
# re-read the rule, re-judge the row, and only then paste the hash in. Pasting it
# without re-reading defeats the check.
#
# Reviewed 2026-10-12 against l3io-wordpress-backup@0431282.

